<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès Autorisé - Fin du Jeu</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #terminal {
            width: 100%;
            max-width: 800px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .header {
            border-bottom: 1px dashed #00ff00;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #output {
            line-height: 1.6;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #00ff00;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        .highlight {
            color: #fff;
            background-color: #00ff00;
            color: #000;
            padding: 0 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="terminal">
        <div class="header">
            root@serveur-depart:~# ./execution_finale.sh
        </div>
        <div id="output"></div><span class="cursor"></span>
    </div>

    <script>
        // === PERSONNALISEZ VOTRE MESSAGE ICI ===
        const lignesDeTexte = [
            "Initialisation de la connexion...",
            "Bypass du firewall interne... [OK]",
            "Déchiffrement de l'ultime message... [OK]",
            " ",
            "===================================================",
            "  ACCÈS AUTORISÉ - SYSTÈME COMPROMIS (POUR DE FAUX)",
            "===================================================",
            " ",
            "Félicitations ! Si vous lisez cet écran, c'est que vous avez brillamment craqué tous les codes.",
            " ",
            "Votre récompense :",
            "<span class='highlight'>SUDO SERVE-MOI-UNE-BIÈRE</span>",
            " ",
            "A réclamer si vous êtes de passage sur Lyon !",
            "Fin de transmission."
        ];

        const outputDiv = document.getElementById('output');
        let indexLigne = 0;
        let indexChar = 0;
        let texteActuel = '';

        function taperTexte() {
            if (indexLigne < lignesDeTexte.length) {
                // Gestion du HTML dans le texte (pour le surlignage du mot de passe)
                if (lignesDeTexte[indexLigne].startsWith("<")) {
                    texteActuel += lignesDeTexte[indexLigne] + "\n";
                    outputDiv.innerHTML = texteActuel;
                    indexLigne++;
                    setTimeout(taperTexte, 500);
                } else {
                    if (indexChar < lignesDeTexte[indexLigne].length) {
                        texteActuel += lignesDeTexte[indexLigne].charAt(indexChar);
                        outputDiv.innerHTML = texteActuel;
                        indexChar++;
                        // Vitesse de frappe (aléatoire pour faire plus "humain/machine")
                        setTimeout(taperTexte, Math.random() * 30 + 10);
                    } else {
                        texteActuel += "\n";
                        outputDiv.innerHTML = texteActuel;
                        indexLigne++;
                        indexChar = 0;
                        // Pause entre les lignes
                        setTimeout(taperTexte, 400);
                    }
                }
            }
        }

        // Démarrage de l'animation après 1 seconde
        setTimeout(taperTexte, 1000);
    </script>

</body>
</html>
